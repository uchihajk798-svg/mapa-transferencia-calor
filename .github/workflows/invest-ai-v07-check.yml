name: INVEST AI WEB v0.7 — Verificação
on:
  pull_request:
    branches: [main]
  push:
    branches: [invest-ai-web-v07-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extrair código web
        run: unzip -q -o INVEST_AI_web_source.zip
      - name: Dependências
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Testar módulos
        working-directory: frontend
        run: npm test
      - name: Verificar TypeScript
        working-directory: frontend
        run: npm run lint
      - name: Compilar Next.js
        working-directory: frontend
        run: npm run build
      - name: Conferir página final
        run: test -s frontend/out/index.html
