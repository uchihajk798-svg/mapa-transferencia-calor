name: INVEST AI - Compilar APK Android
on:
  push:
    branches: [invest-ai-mobile-apk]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar SDK Android do GitHub runner
        run: |
          echo "SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-indisponivel}}"
          test -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/platforms"
      - name: Extrair aplicativo
        run: unzip -q -o INVEST_AI_mobile_source.zip
      - name: Instalar dependencias
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Testar funcoes locais
        working-directory: mobile
        run: npm test
      - name: Verificar tipagem do React Native
        working-directory: mobile
        run: npm run check
      - name: Gerar projeto nativo
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Compilar APK release autossuficiente
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
      - name: Conferir APK
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          APK_SIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner -print -quit)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify "$APK"
      - name: Entregar APK para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INVEST_AI_MOBILE_APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
